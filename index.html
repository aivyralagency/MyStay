<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyStay</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 7vw, 4rem);
      text-align: center;
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 1.5rem;
      box-shadow: 0 1.5rem 4rem rgb(23 32 51 / 8%);
    }

    h1 { margin: 0 0 1rem; font-size: clamp(2.5rem, 8vw, 4rem); }
    p { margin: 0; color: #596579; font-size: 1.125rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>MyStay</h1>
    <p>Welcome to MyStay. Your website is ready for its next chapter.</p>
  </main>
</body>
</html>
